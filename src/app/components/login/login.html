<div class="container mt-5">

  <div class="card p-4">

    <h2>Login Paciente</h2>

    <div class="mb-3">
      <label>Usuario</label>
      <input type="text"
             class="form-control"
             [(ngModel)]="usuario">
    </div>

    <div class="mb-3">
      <label>Contraseña</label>
      <input type="password"
             class="form-control"
             [(ngModel)]="password">
    </div>

    <button class="btn btn-primary"
            (click)="login()">
      Ingresar
    </button>

  </div>

</div>
